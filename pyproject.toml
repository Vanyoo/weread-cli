[project]
name = "weread-cli"
version = "0.1.0"
description = "命令行微信读书工具"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "browser-cookie3>=0.19.1",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    "rich>=13.7.0",
]

[project.scripts]
weread-cli = "weread_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weread_cli"]
